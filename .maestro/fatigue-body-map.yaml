# Debug build; Progress group reachable, no dialog/editor/keyboard. No persistent writes.
appId: com.hydrafit.app
name: Anatomical body map models and views
tags:
  - smoke
  - read-only
---
- launchApp:
    stopApp: false
    clearState: false
    permissions:
      all: unset
- tapOn:
    text: '^Progress$'
    retryTapIfNoChange: false
- tapOn:
    text: '^Fatigue map$'
    retryTapIfNoChange: false
- assertVisible: '^Estimated muscle fatigue$'
- assertVisible: '^Estimated from recorded working sets\. This is not a measurement of soreness, exhaustion or readiness\. Low values do not confirm recovery; recorded muscle mappings may be incomplete\.$'
- takeScreenshot: numeric-estimate-note
- tapOn:
    text: '^Body map$'
    retryTapIfNoChange: false
- assertVisible: '^Male, Front — estimated muscle fatigue$'
- assertNotVisible: '^Retry$'
- takeScreenshot: male-front
- tapOn:
    text: '^Back$'
    retryTapIfNoChange: false
- assertVisible: '^Male, Back — estimated muscle fatigue$'
- takeScreenshot: male-back
- tapOn:
    text: '^Female$'
    retryTapIfNoChange: false
- assertVisible:
    checked: true
    containsDescendants:
      - text: '^Female$'
- assertVisible: '^Female, Back — estimated muscle fatigue$'
- takeScreenshot: female-back
- tapOn:
    text: '^Front$'
    retryTapIfNoChange: false
- assertVisible: '^Female, Front — estimated muscle fatigue$'
- takeScreenshot: female-front
- tapOn:
    text: '^Close$'
    retryTapIfNoChange: false
- assertVisible: '^Estimated muscle fatigue$'
- back
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    selected: true
    containsDescendants:
      - text: '^Train$'
