appId: com.hydrafit.app
---
# Read-only smoke of the Equipment profile and loading configuration after the 0.13.4
# five-section hub split. Preconditions: HydraFit foregrounded on the Equipment hub, no
# keyboard, dialog or unsaved editor. Nothing is written and no dialog is opened.
- assertVisible: Equipment
- assertVisible: Profile & loading
- tapOn:
    text: 'Profile & loading'
    retryTapIfNoChange: false
- assertVisible: Equipment profiles
- assertVisible: Active profile:.*
- scrollUntilVisible:
    element:
      text: Loading configuration
    timeout: 10000
- assertVisible: Loading configuration
- scrollUntilVisible:
    element:
      text: Calculate loading
    timeout: 10000
- assertVisible: Calculate loading
# The affordance is the "Calculate loading" action; "Loading calculator" is only the dialog title.
- assertNotVisible: Loading calculator
- takeScreenshot: equipment-profile-loading
- tapOn:
    text: 'Back'
    retryTapIfNoChange: false
- assertVisible: Inventory & stations
