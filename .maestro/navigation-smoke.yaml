# Contract and verification status: see README.md. No persistent writes.
# Four tabs/rail destinations: Train, Progress, Library and Settings. There is no Settings
# toolbar strip; Library is a hub of Routines and Equipment, not its own routine list.
appId: com.hydrafit.app
name: Four top-level destinations and reselection
tags:
  - smoke
  - read-only
---
- launchApp:
    stopApp: false
    clearState: false
    permissions:
      all: unset
- assertVisible:
    selected: true
    containsDescendants:
      - text: '^Train$'
- assertNotVisible: '^Routine name$'
- assertVisible: '^Manage plan$'
- tapOn:
    text: '^Progress$'
    retryTapIfNoChange: false
- assertVisible: '^Exercise progress$'
- assertVisible: '^Fatigue map$'
- assertVisible:
    selected: true
    containsDescendants:
      - text: '^Progress$'
- tapOn:
    text: '^Library$'
    retryTapIfNoChange: false
- assertVisible: '^Library$'
- assertVisible: '^Routines$'
- assertVisible: '^Equipment$'
- assertVisible:
    selected: true
    containsDescendants:
      - text: '^Library$'
- assertNotVisible: '^Routine name$'
- tapOn:
    text: '^Settings$'
    retryTapIfNoChange: false
- assertVisible: '^Planner engine$'
- assertVisible: '^About$'
- assertNotVisible: '^Manage plan$'
- assertVisible:
    selected: true
    containsDescendants:
      - text: '^Settings$'
# Reselecting the active tab returns its root without saving the previous child page.
- tapOn:
    text: '^Train$'
    retryTapIfNoChange: false
- assertVisible: '^Log workout$'
- assertNotVisible: '^Planner engine$'
- tapOn:
    text: '^Train$'
    retryTapIfNoChange: false
- assertVisible: '^Log workout$'
- assertVisible:
    selected: true
    containsDescendants:
      - text: '^Train$'
