# Contract and verification status: see README.md. Reopens the fixture routine's stored
# prescription, asserts the recorded recipe round-tripped into the fields, adds a prescribed
# RIR and saves. Writes only to the fixture routine created by the apply journey, which must
# not yet have been archived by the cleanup flow.
appId: com.hydrafit.app
name: Routine per-set targets reopen from recipe and add prescribed RIR
tags:
  - smoke
  - routines
  - writes
---
- launchApp:
    stopApp: false
    clearState: false
    permissions:
      all: unset
- tapOn:
    text: '^Routines$'
    retryTapIfNoChange: false
- assertVisible: '^HF UI accept per-set$'
- tapOn:
    text: '^Edit$'
    below: '^HF UI accept per-set$'
    retryTapIfNoChange: false
- assertVisible: '^Routine name$'
- assertVisible: '.*Per-set targets: 3 sets.*'
- tapOn:
    text: '^Per-set targets$'
    retryTapIfNoChange: false
- assertVisible: '^Shape$'
# The dialog reopens from the recorded recipe, not from an inferred shape. Each value is scoped
# to its own labelled field: in the retained compact hierarchy (hf-ui-20) the label is a direct
# child of the field node, so the assertion cannot pass on that number rendered elsewhere.
- assertVisible:
    text: '^3$'
    containsChild:
      text: '^Sets$'
- assertVisible:
    text: '^10$'
    containsChild:
      text: '^Start reps$'
- assertVisible:
    text: '^6$'
    containsChild:
      text: '^End reps$'
- assertVisible:
    text: '^60$'
    containsChild:
      text: '^Start load \(kg\)$'
- assertVisible:
    text: '^80$'
    containsChild:
      text: '^End load \(kg\)$'
# The round-to value is part of the recorded recipe too, and was never asserted before.
- assertVisible:
    text: '^2\.5$'
    containsChild:
      text: '^Round to \(kg\)$'
- tapOn:
    containsChild:
      text: '^Prescribed RIR \(optional\)$'
    retryTapIfNoChange: false
- eraseText
- inputText: '2'
- assertVisible:
    text: '^2$'
    containsChild:
      text: '^Prescribed RIR \(optional\)$'
- hideKeyboard
- assertVisible: '^Shape$'
- tapOn:
    text: '^Apply$'
    retryTapIfNoChange: false
- assertNotVisible: '^Shape$'
- assertVisible: '.*Per-set targets: 3 sets.*'
- scrollUntilVisible:
    element:
      text: '^Save$'
    direction: DOWN
    timeout: 30000
- tapOn:
    text: '^Save$'
    retryTapIfNoChange: false
- assertVisible: '^New routine$'
- assertVisible: '^HF UI accept per-set$'
