name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run ktlint
        run: ./gradlew ktlintCheck

  tooling:
    name: Agent tooling checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Check shell syntax
        run: for f in scripts/*.sh; do bash -n "$f" || exit 1; done
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck --severity=warning scripts/*.sh
      - name: Validate agent tooling definitions and references
        run: python3 scripts/validate-agent-tooling.py
      - name: Run agent tooling tests
        run: python3 scripts/tests/test_validate_tooling.py
      - name: Run scrolling helper tests
        run: python3 scripts/tests/test_maestro_scroll.py

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run host unit tests
        run: ./gradlew testAndroidHostTest
      - name: Verify SQLDelight migrations
        run: ./gradlew verifySqlDelightMigration

  # Temporarily disabled 2026-10-13: the macOS-hosted job queued for a runner for 20+ minutes on
  # PR #11 and blocked the pipeline. HydraFit is Android-first and iOS is not yet a development
  # target, so there is nothing to compile against yet. Re-enable this job when iOS development
  # starts, and keep running the iOS compile tasks locally at the release integration gate until
  # then (docs/agent-project-reference.md Key Commands).
  # ios-compile:
  #   name: iOS Compile
  #   runs-on: macos-latest
  #   timeout-minutes: 15
  #   steps:
  #     - name: Checkout sources
  #       uses: actions/checkout@v6
  #     - name: Setup Java
  #       uses: actions/setup-java@v5
  #       with:
  #         distribution: temurin
  #         java-version: '17'
  #     - name: Setup Gradle
  #       uses: gradle/actions/setup-gradle@v6
  #     - name: Compile iOS targets
  #       run: ./gradlew :shared:compileKotlinIosSimulatorArm64 :core:network:compileKotlinIosSimulatorArm64

  assemble-debug-apk:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Assemble debug APK and check release lint
        run: ./gradlew :androidApp:assembleDebug :androidApp:lintVitalRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
